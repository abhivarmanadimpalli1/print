<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">
  <filter id="paper">
    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise" />
    <feDiffuseLighting in="noise" lighting-color="#ffffff" surfaceScale="0.7">
      <feDistantLight azimuth="45" elevation="60" />
    </feDiffuseLighting>
  </filter>
  <rect width="100%" height="100%" fill="#ffffff" filter="url(#paper)" opacity="0.95" />
</svg>
